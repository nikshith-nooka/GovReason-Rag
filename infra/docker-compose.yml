version: '3.8'

services:
  # 1. FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: govreason_api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql://govuser:govpass@postgres:5432/govreasondb
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=govreasonpass
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=deterministic
    depends_on:
      - postgres
      - neo4j
      - qdrant
    networks:
      - govreason-net

  # 2. Next.js Frontend Service
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: govreason_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - govreason-net

  # 3. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: govreason_postgres
    environment:
      POSTGRES_USER: govuser
      POSTGRES_PASSWORD: govpass
      POSTGRES_DB: govreasondb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - govreason-net

  # 4. Neo4j Graph Database
  neo4j:
    image: neo4j:5.18-community
    container_name: govreason_neo4j
    environment:
      NEO4J_AUTH: neo4j/govreasonpass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    networks:
      - govreason-net

  # 5. Qdrant Vector Search Engine
  qdrant:
    image: qdrant/qdrant:latest
    container_name: govreason_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - govreason-net

networks:
  govreason-net:
    driver: bridge

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
